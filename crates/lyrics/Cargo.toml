[package]
name = "soundcraft-lyrics"
description = "SoundCraft lyrics: transcribes sung vocals with a local Parakeet model on the GPU and finds the chorus"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
log.workspace = true
rustfft.workspace = true

# The model runs natively only: the web build reports "unsupported".
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# NVIDIA Parakeet TDT 0.6B v3 in pure Rust on Burn (MIT OR Apache-2.0). Pinned: its Burn graph is
# generated for one Burn version.
parakeet-rs = { version = "=0.4.4", default-features = false, features = ["wgpu"] }
# GPU kernel-tuning cache location (Burn's compute runtime for parakeet-rs).
cubecl = { version = "0.11", default-features = false, features = ["std"] }
ureq = "3"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
parakeet-rs = { version = "=0.4.4", default-features = false, features = ["metal"] }

[lints]
workspace = true

[dev-dependencies]
hound = "3"
